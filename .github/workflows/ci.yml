name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - default

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TEST_ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}
      REPORT_JSON_PATH: reports/cucumber-report.json
      REPORT_ZIP_PATH: reports/test-report-${{ github.run_id }}.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Create reports directory
        run: mkdir -p reports/screenshots

      - name: Run tests
        id: tests
        env:
          MAILSLURP_API_KEY: ${{ secrets.MAILSLURP_API_KEY }}
          BASE_URL: ${{ vars.BASE_URL || 'https://staging.spot.care/' }}
          HEADLESS: 'true'
          DEFAULT_TIMEOUT: '60000'
        run: |
          if [ "$TEST_ENVIRONMENT" = "staging" ]; then
            npm run test:staging
          else
            npm test
          fi

      - name: Create zipped report
        if: always()
        run: |
          if [ ! -d reports ]; then
            echo "reports directory not found"
            exit 1
          fi

          rm -f "$REPORT_ZIP_PATH"
          zip -r "$REPORT_ZIP_PATH" reports

      - name: Send report email
        if: always()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_SUBJECT_PREFIX: ${{ vars.MAIL_SUBJECT_PREFIX || 'Spot Care Automation' }}
          TEST_STATUS: ${{ steps.tests.outcome }}
          TEST_ENVIRONMENT: ${{ env.TEST_ENVIRONMENT }}
          REPORT_JSON_PATH: ${{ env.REPORT_JSON_PATH }}
        run: node scripts/send-report-email.js "$REPORT_ZIP_PATH"

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            reports/cucumber-report.html
            reports/cucumber-report.json
            reports/screenshots/
            ${{ env.REPORT_ZIP_PATH }}
          retention-days: 14

      - name: Publish test summary
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const path = 'reports/cucumber-report.json';

            if (!fs.existsSync(path)) {
              core.warning('No test report found');
              return;
            }

            try {
              const report = JSON.parse(fs.readFileSync(path, 'utf8'));
              let passed = 0;
              let failed = 0;
              let skipped = 0;

              for (const feature of report) {
                for (const element of feature.elements || []) {
                  if (element.type === 'scenario') {
                    const steps = element.steps || [];
                    const hasFailed = steps.some(s => s.result?.status === 'failed');
                    const hasSkipped = steps.some(s => s.result?.status === 'skipped');
                    const allPassed = steps.every(s => s.result?.status === 'passed');

                    if (hasFailed) failed++;
                    else if (hasSkipped && !allPassed) skipped++;
                    else if (allPassed) passed++;
                  }
                }
              }

              const total = passed + failed + skipped;
              const summary = `## Test Results\n\n| Status | Count |\n|--------|-------|\n| ✅ Passed | ${passed} |\n| ❌ Failed | ${failed} |\n| ⏭️ Skipped | ${skipped} |\n| **Total** | **${total}** |`;

              await core.summary.addRaw(summary).write();
            } catch (error) {
              core.warning(`Failed to parse test report: ${error.message}`);
            }

      - name: Fail job when tests fail
        if: always() && steps.tests.outcome == 'failure'
        run: exit 1
